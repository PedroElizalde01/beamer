name: Linux packages

# Builds the .deb and the AppImage on every version tag and attaches them to its release;
# run by hand from the Actions tab to get them as a build artifact instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The oldest glibc the packages will run on is the one they are built against.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System libraries the bundle picks up
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libfuse2 xclip
      - name: Python packages
        run: python -m pip install -r linux_app/requirements-linux.txt "pyinstaller>=6.0" "pyinstaller-hooks-contrib>=2024.1"
      - name: Build
        run: PYTHON=python linux_app/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: beamer-linux
          path: |
            linux_app/dist/*.deb
            linux_app/dist/*.AppImage
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux_app/dist/*.deb
            linux_app/dist/*.AppImage
